<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS LAYOUT MANAGER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cell { aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 1px solid #475569; }
        .palette-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; }
        .selected { border-color: white; transform: scale(1.1); }
        .bg-0 { background: #1f2937; } .bg-1 { background: #ef4444; } .bg-2 { background: #3b82f6; } 
        .bg-3 { background: #22c55e; } .bg-4 { background: #eab308; } .bg-5 { background: #a855f7; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 p-4">

<div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
        <h1 class="text-lg font-black">MANAGER</h1>
        <div class="flex gap-2">
            <button id="save-btn" onclick="saveToGitHub()" class="hidden bg-emerald-600 px-3 py-1 rounded text-xs font-bold">保存</button>
            <button id="admin-btn" onclick="openAuth()" class="bg-slate-800 px-3 py-1 rounded text-xs font-bold">管理設定</button>
        </div>
    </header>

    <section class="bg-slate-900 p-4 rounded-xl mb-6">
        <div id="board" class="board mb-6"></div>
        <div id="palette" class="flex justify-center gap-3"></div>
    </section>

    <section class="bg-slate-900 p-4 rounded-xl">
        <h2 class="text-xs font-bold text-indigo-400 mb-2">現在のバフ合計</h2>
        <div id="buff-display" class="text-xs space-y-1">読み込み中...</div>
    </section>
</div>

<div id="admin-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 p-6 rounded-xl w-full max-w-sm">
        <h2 class="font-bold mb-4 text-sm">GitHub 管理設定</h2>
        <input type="password" id="admin-pin" placeholder="PIN (4桁)" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
        <input type="text" id="cfg-owner" placeholder="Owner" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
        <input type="text" id="cfg-repo" placeholder="Repo" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
        <input type="password" id="cfg-token" placeholder="GitHub PAT" class="w-full bg-slate-800 p-2 mb-4 rounded text-sm">
        <button onclick="applyAdmin()" class="w-full bg-indigo-600 py-2 rounded font-bold text-sm">認証して適用</button>
        <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="w-full mt-2 text-slate-500 text-xs">閉じる</button>
    </div>
</div>

<script>
    let gridState = Array(35).fill(0), selectedColor = 1, currentSha = '', config = {};
    const CONFIG_KEY = 'pz_chess_config';

    async function init() {
        const stored = localStorage.getItem(CONFIG_KEY);
        if(stored) {
            config = JSON.parse(stored);
            await loadFromGitHub();
        }
        renderBoard();
        renderPalette();
    }

    async function loadFromGitHub() {
        try {
            const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/recipes.json`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${config.token}` } });
            const data = await res.json();
            currentSha = data.sha;
            gridState = JSON.parse(atob(data.content));
            renderBoard();
            document.getElementById('buff-display').innerHTML = "読み込み完了";
        } catch(e) { document.getElementById('buff-display').innerHTML = "データ取得失敗"; }
    }

    async function saveToGitHub() {
        const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/recipes.json`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: "更新",
                content: btoa(JSON.stringify(gridState)),
                sha: currentSha
            })
        });
        if(res.ok) alert("GitHubへ保存しました");
    }

    function applyAdmin() {
        if(document.getElementById('admin-pin').value !== '1234') return alert('PIN不正');
        config = {
            owner: document.getElementById('cfg-owner').value,
            repo: document.getElementById('cfg-repo').value,
            token: document.getElementById('cfg-token').value
        };
        localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        document.getElementById('save-btn').classList.remove('hidden');
        document.getElementById('admin-modal').classList.add('hidden');
        loadFromGitHub();
    }

    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        gridState.forEach((val, i) => {
            const d = document.createElement('div');
            d.className = `cell bg-${val}`;
            d.onclick = () => { gridState[i] = selectedColor; renderBoard(); };
            board.appendChild(d);
        });
    }

    function renderPalette() {
        const p = document.getElementById('palette');
        [0,1,2,3,4,5].forEach(c => {
            const b = document.createElement('button');
            b.className = `palette-btn bg-${c} ${selectedColor === c ? 'selected' : ''}`;
            b.onclick = () => { selectedColor = c; renderPalette(); };
            p.appendChild(b);
        });
    }

    function openAuth() { document.getElementById('admin-modal').classList.remove('hidden'); }
    init();
</script>
</body>
</html>
