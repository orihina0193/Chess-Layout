<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Puzzles & Survival Layout Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chess-cell { width: 3rem; height: 3rem; border-radius: 50%; transition: all 0.2s; }
        .color-0 { background: #374151; } /* Empty */
        .color-1 { background: #ef4444; } /* Red */
        .color-2 { background: #3b82f6; } /* Blue */
        .color-3 { background: #22c55e; } /* Green */
        .color-4 { background: #eab308; } /* Yellow */
        .color-5 { background: #a855f7; } /* Purple */
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">チェスレイアウト管理</h1>
            <input type="password" id="pin" placeholder="PIN(4桁)" class="bg-gray-800 p-2 rounded w-20 text-center">
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                <select id="recipe-select" class="w-full bg-gray-800 p-3 rounded mb-4" onchange="displayRecipe()">
                    <option value="">レシピを選択してください</option>
                </select>
                <div id="grid-view" class="grid grid-cols-4 gap-2 mb-4 justify-items-center"></div>
                <div id="recipe-info" class="text-sm text-gray-400 space-y-1"></div>
            </div>

            <div id="admin-panel" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800">
                <h2 class="text-lg font-bold mb-4 text-blue-400">GitHub 設定</h2>
                <input type="text" id="gh-owner" placeholder="Owner" class="w-full bg-gray-800 p-2 mb-2 rounded">
                <input type="text" id="gh-repo" placeholder="Repo" class="w-full bg-gray-800 p-2 mb-2 rounded">
                <input type="password" id="gh-token" placeholder="Personal Access Token" class="w-full bg-gray-800 p-2 mb-4 rounded">
                <button onclick="saveConfig()" class="w-full bg-blue-600 p-2 rounded hover:bg-blue-500">保存して同期</button>
            </div>
        </div>
    </div>

    <script>
        let recipes = []; // ここに読み込んだレシピデータが入る

        // PIN認証
        document.getElementById('pin').addEventListener('input', (e) => {
            if(e.target.value === '1234') {
                document.getElementById('admin-panel').classList.remove('hidden');
            }
        });

        // レシピ表示ロジック
        function displayRecipe() {
            const id = document.getElementById('recipe-select').value;
            const recipe = recipes.find(r => r.id === id);
            if(!recipe) return;

            const grid = document.getElementById('grid-view');
            grid.innerHTML = '';
            recipe.grid.flat().forEach(val => {
                const cell = document.createElement('div');
                cell.className = `chess-cell color-${val}`;
                grid.appendChild(cell);
            });

            document.getElementById('recipe-info').innerHTML = `
                <p class="text-white font-bold">${recipe.name}</p>
                <p>バフ: ${recipe.effect.target} ${recipe.effect.type} +${recipe.effect.value}%</p>
            `;
        }

        // 初期化：GitHubからレシピを取得（ダミーデータで代用可）
        async function loadRecipes() {
            // 本番ではここで fetch("https://api.github.com/repos/...") を呼ぶ
            // 頂いたJSONをここに読み込む処理を実装
            console.log("Recipes loaded");
        }

        loadRecipes();
    </script>
</body>
</html>
