<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS MANAGER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cell { aspect-ratio: 1; border-radius: 50%; border: 2px solid #334155; cursor: pointer; }
        .bg-0 { background: #1e293b; } .bg-1 { background: #ef4444; } .bg-2 { background: #3b82f6; } 
        .bg-3 { background: #22c55e; } .bg-4 { background: #eab308; } .bg-5 { background: #a855f7; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 p-4">

<div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-lg font-black">CHESS MANAGER</h1>
        <button id="auth-btn" onclick="openAuth()" class="bg-slate-800 px-3 py-1 rounded text-xs font-bold">管理設定</button>
    </header>

    <div id="board" class="board mb-6"></div>

    <div id="admin-panel" class="hidden space-y-4">
        <button onclick="saveData()" class="w-full bg-emerald-600 py-2 rounded text-sm font-bold">GitHubに保存</button>
    </div>
</div>

<div id="auth-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 p-6 rounded-xl w-full max-w-sm">
        <h2 class="font-bold mb-4">PIN認証</h2>
        <input type="password" id="pin-input" maxlength="4" class="w-full bg-slate-800 p-2 mb-4 rounded text-center text-xl tracking-widest">
        <button onclick="verifyPin()" class="w-full bg-indigo-600 py-2 rounded font-bold">ログイン</button>
    </div>
</div>

<script>
    let grid = Array(35).fill(0);
    const board = document.getElementById('board');

    // ボード描画
    function draw() {
        board.innerHTML = '';
        grid.forEach((v, i) => {
            const d = document.createElement('div');
            d.className = `cell bg-${v}`;
            d.onclick = () => { grid[i] = (grid[i] + 1) % 6; draw(); };
            board.appendChild(d);
        });
    }

    // PIN認証処理
    function openAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
    
    function verifyPin() {
        const pin = document.getElementById('pin-input').value;
        if (pin === '1234') { // 設定したPIN
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('auth-btn').classList.add('hidden');
            alert("管理モードに移行しました");
        } else {
            alert("PINが違います");
        }
    }

    async function saveData() {
        alert("GitHubへの保存処理を実行します");
        // ここにGitHub API PUTのロジックを正確に記述します
    }

    draw();
</script>
</body>
</html>
