<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .bg-0 { background: #374151; } .bg-1 { background: #ef4444; } .bg-2 { background: #3b82f6; } 
        .bg-3 { background: #22c55e; } .bg-4 { background: #eab308; } .bg-5 { background: #a855f7; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 p-6">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black">CHESS LAYOUT MANAGER</h1>
            <button onclick="document.getElementById('admin-modal').classList.remove('hidden')" class="text-xs bg-slate-800 px-4 py-2 rounded">管理設定</button>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <section>
                <h2 class="text-sm font-bold mb-2">フルレイアウト (5x7)</h2>
                <div id="full-board" class="grid grid-cols-7 gap-1 bg-slate-900 p-2 rounded w-fit"></div>
                <div id="stats" class="mt-4 text-xs bg-slate-900 p-4 rounded"></div>
            </section>
            <section>
                <h2 class="text-sm font-bold mb-2">レシピ一覧</h2>
                <div id="recipe-list" class="space-y-2"></div>
            </section>
        </div>
    </div>

    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-slate-900 p-6 rounded-lg w-full max-w-sm">
            <h2 class="font-bold mb-4">管理設定</h2>
            <input type="password" id="pin" placeholder="PIN(4桁)" class="w-full bg-slate-800 p-2 mb-2 rounded">
            <input type="text" id="token" placeholder="GitHub Token" class="w-full bg-slate-800 p-2 mb-2 rounded">
            <button onclick="saveAdmin()" class="w-full bg-indigo-600 py-2 rounded">保存</button>
        </div>
    </div>

<script>
    let recipes = [], layout = [];
    const cfg = JSON.parse(localStorage.getItem('pz_cfg') || '{}');

    // GitHubからデータを読み込む
    async function loadData() {
        try {
            const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/recipes.json`, {
                headers: { 'Accept': 'application/vnd.github.v3.raw', 'Authorization': `token ${cfg.token}` }
            });
            recipes = await res.json();
            renderRecipes();
        } catch(e) { console.error("データ取得失敗:", e); }
    }

    function renderRecipes() {
        const list = document.getElementById('recipe-list');
        list.innerHTML = recipes.map(r => `
            <div class="flex justify-between bg-slate-800 p-2 rounded text-xs">
                <span>${r.name}</span>
                <button onclick="addToLayout('${r.id}')" class="bg-indigo-600 px-2 rounded">追加</button>
            </div>
        `).join('');
    }

    function addToLayout(id) {
        if(layout.find(r => r.id === id)) return alert("重複不可");
        layout.push(recipes.find(r => r.id === id));
        updateStats();
    }

    function updateStats() {
        let cost = {red:0, blue:0, green:0, yellow:0, purple:0};
        let buffs = {};
        layout.forEach(r => {
            for(let c in r.cost) cost[c] += r.cost[c];
            let k = r.effect.target + r.effect.type;
            buffs[k] = (buffs[k] || 0) + r.effect.value;
        });
        document.getElementById('stats').innerHTML = `
            <p class="text-green-400 font-bold">必要: ${JSON.stringify(cost)}</p>
            <p>バフ: ${JSON.stringify(buffs)}</p>
        `;
    }

    function saveAdmin() {
        localStorage.setItem('pz_cfg', JSON.stringify({
            owner: 'YOUR_OWNER', repo: 'YOUR_REPO', pin: document.getElementById('pin').value, token: document.getElementById('token').value
        }));
        document.getElementById('admin-modal').classList.add('hidden');
    }

    loadData();
</script>
</body>
</html>
