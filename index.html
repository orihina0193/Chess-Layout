<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS LAYOUT MANAGER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cell { aspect-ratio: 1; border-radius: 50%; border: 1px solid #475569; }
        .cell.editable { cursor: pointer; }
        .palette-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; }
        .selected { border-color: white; transform: scale(1.1); }
        .bg-0 { background: #1f2937; } .bg-1 { background: #ef4444; } .bg-2 { background: #3b82f6; } 
        .bg-3 { background: #22c55e; } .bg-4 { background: #eab308; } .bg-5 { background: #a855f7; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 p-4">

<div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
        <h1 class="text-lg font-black" id="mode-title">閲覧モード</h1>
        <div class="flex gap-2">
            <button id="save-btn" onclick="saveToGitHub()" class="hidden bg-emerald-600 px-3 py-1 rounded text-xs font-bold">保存</button>
            <button id="admin-trigger" onclick="openAuth()" class="bg-slate-800 px-3 py-1 rounded text-xs font-bold">管理設定</button>
        </div>
    </header>

    <section class="bg-slate-900 p-4 rounded-xl mb-6">
        <div id="board" class="board mb-6"></div>
        <div id="palette" class="hidden flex justify-center gap-3"></div>
    </section>

    <section class="bg-slate-900 p-4 rounded-xl">
        <h2 class="text-xs font-bold text-indigo-400 mb-2">現在のバフ合計</h2>
        <div id="buff-display" class="text-xs space-y-1">配置してください</div>
    </section>
</div>

<div id="auth-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 p-6 rounded-xl w-full max-w-sm">
        <h2 class="font-bold mb-4 text-sm">管理設定</h2>
        <input type="password" id="admin-pin" placeholder="PIN (4桁)" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
        <input type="text" id="cfg-owner" placeholder="Owner" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
        <input type="text" id="cfg-repo" placeholder="Repo" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
        <input type="password" id="cfg-token" placeholder="GitHub PAT" class="w-full bg-slate-800 p-2 mb-4 rounded text-sm">
        <button onclick="verifyAndApply()" class="w-full bg-indigo-600 py-2 rounded font-bold text-sm">適用</button>
    </div>
</div>

<script>
    let gridState = Array(35).fill(0), selectedColor = 1, isAuth = false, config = {}, currentSha = '';

    // GitHub通信：保存用関数
    async function saveToGitHub() {
        if (!config.token) return alert("設定が未完了です");
        try {
            const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/data.json`, {
                method: 'PUT',
                headers: { 
                    'Authorization': `token ${config.token}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    message: "Layout Update",
                    content: btoa(JSON.stringify(gridState)),
                    sha: currentSha
                })
            });
            const data = await res.json();
            if (res.ok) {
                currentSha = data.content.sha;
                alert("GitHubへ保存成功");
            } else {
                alert("保存失敗: " + data.message);
            }
        } catch(e) { alert("通信エラー"); }
    }

    function verifyAndApply() {
        if (document.getElementById('admin-pin').value !== '1234') return alert('PIN不正');
        config = {
            owner: document.getElementById('cfg-owner').value,
            repo: document.getElementById('cfg-repo').value,
            token: document.getElementById('cfg-token').value
        };
        isAuth = true;
        document.getElementById('mode-title').innerText = "管理モード";
        document.getElementById('palette').classList.remove('hidden');
        document.getElementById('save-btn').classList.remove('hidden');
        document.getElementById('auth-modal').classList.add('hidden');
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        gridState.forEach((val, i) => {
            const d = document.createElement('div');
            d.className = `cell bg-${val} ${isAuth ? 'editable' : ''}`;
            if(isAuth) d.onclick = () => { gridState[i] = selectedColor; renderBoard(); updateBuffs(); };
            board.appendChild(d);
        });
        updateBuffs();
    }

    function updateBuffs() {
        const counts = gridState.reduce((acc, v) => (v > 0 && (acc[v] = (acc[v]||0)+1), acc), {});
        document.getElementById('buff-display').innerHTML = Object.keys(counts).length 
            ? Object.entries(counts).map(([c, n]) => `<p>色 ${c}: ${n}個</p>`).join('')
            : '配置してください';
    }

    function openAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
    renderBoard();
</script>
</body>
</html>
