      // Empty matrix initiations
      function createEmptyGrid(r, c) {
        return Array.from({ length: r }, () => Array(c).fill('empty'));
      }

      // Counts active chess pieces count inside recipe 4x4 grid
      function getRecipeChessCount(grid) {
        let count = 0;
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (grid[r][c] !== 'empty') {
              count++;
            }
          }
        }
        return count;
      }

      // Calculations rules: 4 pieces -> 5000pt, 3 pieces -> 2000pt, others fallback
      function getRecipeScore(recipe) {
        const count = getRecipeChessCount(recipe.grid);
        if (count === 4) return 5000;
        if (count === 3) return 2000;
        if (count === 2) return 1000;
        if (count === 1) return 500;
        if (count > 4) return 5000 + (count - 4) * 1000;
        return 0;
      }

      // Count color frequency details inside layout or recipe
      function countChessColors(grid) {
        const counts = { red: 0, blue: 0, green: 0, yellow: 0, purple: 0 };
        for (let r = 0; r < grid.length; r++) {
          for (let c = 0; c < grid[r].length; c++) {
            const col = grid[r][c];
            if (col !== 'empty') {
              counts[col] = (counts[col] || 0) + 1;
            }
          }
        }
        return counts;
      }

      function countRecipeChessColors(grid) {
        return countChessColors(grid);

      // Base64 converters for GitHub file contents
      function utf8ToBase64(str) {
        return btoa(unescape(encodeURIComponent(str)));
      }

      function base64ToUtf8(str) {
        return decodeURIComponent(escape(atob(str)));
      }

      // Normalizers when syncing from dynamic backups
      function normalizeRecipes(rawRecipes) {
        if (!Array.isArray(rawRecipes)) return [];
        const COLOR_MAP = {
          0: 'empty', 1: 'red', 2: 'blue', 3: 'green', 4: 'yellow', 5: 'purple',
          'empty': 'empty', 'red': 'red', 'blue': 'blue', 'green': 'green', 'yellow': 'yellow', 'purple': 'purple'
        };
        const TARGET_MAP = {
          'fighter': 'fighter', 'rider': 'rider', 'shooter': 'shooter', 'army': 'army',
          'Troop': 'army', 'Fighter': 'fighter', 'Rider': 'rider', 'Shooter': 'shooter'
        };
        const TYPE_MAP = {
          'atk': 'atk', 'def': 'def', 'hp': 'hp',
          'ATK': 'atk', 'DEF': 'def', 'HP': 'hp'
        };

        return rawRecipes.map((item, idx) => {
          const id = item.id || `custom_${Date.now()}_${idx}`;
          let grid = createEmptyGrid(4, 4);
          if (Array.isArray(item.grid)) {
            for (let r = 0; r < 4; r++) {
              if (Array.isArray(item.grid[r])) {
                for (let c = 0; c < 4; c++) {
                  const val = item.grid[r][c];
                  grid[r][c] = COLOR_MAP[val] || 'empty';
                }
              }
            }
          }

          let target = 'army';
          if (item.target && TARGET_MAP[item.target]) {
            target = TARGET_MAP[item.target];
          } else if (item.effect && item.effect.target && TARGET_MAP[item.effect.target]) {
            target = TARGET_MAP[item.effect.target];
          }

          let buffType = 'hp';
          if (item.buffType && TYPE_MAP[item.buffType]) {
            buffType = TYPE_MAP[item.buffType];
          } else if (item.effect && item.effect.type && TYPE_MAP[item.effect.type]) {
            buffType = TYPE_MAP[item.effect.type];
          } else if (item.effect && item.effect.buffType && TYPE_MAP[item.effect.buffType]) {
            buffType = TYPE_MAP[item.effect.buffType];
          }

          let value = 0;
          if (typeof item.value === 'number') {
            value = item.value;
          } else if (item.effect && typeof item.effect.value === 'number') {
            value = item.effect.value;
          }

          return {
            id,
            name: item.name || `レシピ ${idx + 1}`,
            grid,
            target,
            buffType,
            value,
            createdAt: item.createdAt || (Date.now() - idx * 1000)
          };
        });
      }

      function normalizeGithubData(rawData) {
        const result = {
          recipes: [],
          layouts: [],
          pin: '1234',
          githubConfig: { owner: '', repo: '', path: '', token: '' }
        };

        if (!rawData) {
          result.recipes = DEFAULT_RECIPES;
          result.layouts = DEFAULT_LAYOUTS;
          return result;
        }

        if (Array.isArray(rawData)) {
          result.recipes = normalizeRecipes(rawData);
          result.layouts = DEFAULT_LAYOUTS;
        } else {
          if (rawData.recipes) {
            result.recipes = normalizeRecipes(rawData.recipes);
          } else if (rawData.grid) {
            result.recipes = normalizeRecipes([rawData]);
          } else {
            result.recipes = DEFAULT_RECIPES;
          }

          if (rawData.layouts && Array.isArray(rawData.layouts) && rawData.layouts.length > 0) {
            result.layouts = rawData.layouts;
          } else {
            result.layouts = DEFAULT_LAYOUTS;
          }

          if (rawData.pin) {
            result.pin = String(rawData.pin);
          }
          if (rawData.githubConfig) {
            result.githubConfig = rawData.githubConfig;
          }
        }
        return result;
      }

      // Translation-Independent Pattern Match Core Algorithm (deduplicated per layout)
      function findMatches(layoutGrid, recipes, strictEmpty = false) {
        const matches = [];
        const matchedRecipeIds = new Set();

        for (const recipe of recipes) {
          if (matchedRecipeIds.has(recipe.id)) {
            continue;
          }

          // Gather non-empty cells
          const activeCells = [];
          for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
              if (recipe.grid[i][j] !== 'empty') {
                activeCells.push({ r: i, c: j, color: recipe.grid[i][j] });
              }
            }
          }

          if (activeCells.length === 0) {
            continue;
          }

          const baseCell = activeCells[0];
          let foundMatch = false;
          let matchedPos = { row: 0, col: 0 };

          // Translate patterns testing all 5x7 cells
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 7; c++) {
              const dr = r - baseCell.r;
              const dc = c - baseCell.c;

              let isMatch = true;
              for (const cell of activeCells) {
                const targetR = cell.r + dr;
                const targetC = cell.c + dc;

                if (targetR < 0 || targetR >= 5 || targetC < 0 || targetC >= 7) {
                  isMatch = false;
                  break;
                }

                if (layoutGrid[targetR][targetC] !== cell.color) {
                  isMatch = false;
                  break;
                }
              }

              // Strict empty enforcement within bounding 4x4 layout of recipe
              if (isMatch && strictEmpty) {
                if (dr < 0 || dr + 3 >= 5 || dc < 0 || dc + 3 >= 7) {
                  isMatch = false;
                } else {
                  for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                      if (recipe.grid[i][j] === 'empty') {
                        const targetR = i + dr;
                        const targetC = j + dc;
                        if (layoutGrid[targetR][targetC] !== 'empty') {
                          isMatch = false;
                          break;
                        }
                      }
                    }
                    if (!isMatch) break;
                  }
                }
              }

              if (isMatch) {
                foundMatch = true;
                matchedPos = { row: dr, col: dc };
                break;
              }
            }
            if (foundMatch) break;
          }

          if (foundMatch) {
            matches.push({
              recipe,
              row: matchedPos.row,
              col: matchedPos.col,
            });
            matchedRecipeIds.add(recipe.id);
          }
        }

        return matches;
      }

      // Load files metadata from GitHub API (read operation)
      async function loadDataFromGithub(owner, repo, filePath, token) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
        const headers = {
          'Accept': 'application/vnd.github.v3+json',
        };
        if (token) {
          headers['Authorization'] = `token ${token}`;
        }
        const response = await fetch(url, { headers });
        if (!response.ok) {
          throw new Error(`Status ${response.status} - ${response.statusText}`);
        }
        const json = await response.json();
        const rawContent = base64ToUtf8(json.content);
        let parsed = null;
        try {
          parsed = JSON.parse(rawContent);
        } catch (err) {
          console.error('Failed to parse loaded JSON content:', err);
        }
        const data = normalizeGithubData(parsed);
        return {
          data,
          sha: json.sha
        };
      }

      // Save files metadata to GitHub API (write operation)
      async function saveDataToGithub(owner, repo, filePath, token, data, sha) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
        
        let currentSha = sha;
        try {
          const checkHeaders = { 'Accept': 'application/vnd.github.v3+json' };
          if (token) checkHeaders['Authorization'] = `token ${token}`;
          const checkResponse = await fetch(url, { headers: checkHeaders });
          if (checkResponse.ok) {
            const checkJson = await checkResponse.json();
            currentSha = checkJson.sha;
          }
        } catch (err) {
          console.warn('Could not fetch latest SHA on backup check', err);
        }

        const cleanData = {
          ...data,
          githubConfig: data.githubConfig ? {
            ...data.githubConfig,
            token: '' // Omit private active PAT to bypass Github Secret Protection scanner rules
          } : undefined
        };

        const contentBase64 = utf8ToBase64(JSON.stringify(cleanData, null, 2));
        const body = {
          message: 'Update Chess Recipes and Layouts (via Stanford GitHub Backup)',
          content: contentBase64,
          sha: currentSha || undefined
        };

        const headers = {
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
          'Authorization': `token ${token}`
        };

        const response = await fetch(url, {
          method: 'PUT',
          headers,
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const errBody = await response.text();
          throw new Error(`Status ${response.status} - ${errBody}`);
        }

        const responseJson = await response.json();
        return responseJson.content.sha;
      }

      const LOCAL_STORAGE_KEY = 'chess_recipe_system_standalone_data';

      function App() {
        // Core states
        const [recipes, setRecipes] = useState(DEFAULT_RECIPES);
        const [layouts, setLayouts] = useState(DEFAULT_LAYOUTS);
        const [selectedLayoutId, setSelectedLayoutId] = useState('layout-1');
        const [strictEmptyMatching, setStrictEmptyMatching] = useState(false);

        // Security / management mode states
        const [pin, setPin] = useState('1234');
        const [isManagementMode, setIsManagementMode] = useState(false);
        const [pinInput, setPinInput] = useState('');
        const [pinError, setPinError] = useState(null);

        // Editing target objects states
        const [editingRecipe, setEditingRecipe] = useState(null);
        const [editingLayout, setEditingLayout] = useState(null);
        const [activePaletteColor, setActivePaletteColor] = useState('red');

        // Layout interaction hover coordination states
        const [highlightedCells, setHighlightedCells] = useState(new Set());
        const [selectedMatchForHighlight, setSelectedMatchForHighlight] = useState(null);

        // GitHub backup states
        const [githubConfig, setGithubConfig] = useState({ owner: '', repo: '', path: 'recipes.json', token: '' });
        const [currentSha, setCurrentSha] = useState('');
        const [syncStatus, setSyncStatus] = useState(null);
        const [syncLoading, setSyncLoading] = useState(false);

        // PIN update form fields states
        const [newPin, setNewPin] = useState('');
        const [pinChangeSuccess, setPinChangeSuccess] = useState(false);

        // Trigger manual local storage loads
        useEffect(() => {
          const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              const normalized = normalizeGithubData(parsed);
              setRecipes(normalized.recipes || DEFAULT_RECIPES);
              setLayouts(normalized.layouts || DEFAULT_LAYOUTS);
              setPin(normalized.pin || '1234');
              if (normalized.githubConfig) {
                setGithubConfig(normalized.githubConfig);
              }
              if (normalized.layouts && normalized.layouts.length > 0) {
                setSelectedLayoutId(normalized.layouts[0].id);
              }
            } catch (err) {
              console.error('Failed to parse localStorage data', err);
            }
          }
        }, []);

        // Keep selectedLayoutId pointing to a valid layout
        useEffect(() => {
          if (layouts.length > 0) {
            const exists = layouts.some(l => l.id === selectedLayoutId);
            if (!exists) {
              setSelectedLayoutId(layouts[0].id);
            }
          }
        }, [layouts, selectedLayoutId]);

        // Clear persistent highlight when layout changes
        useEffect(() => {
          setSelectedMatchForHighlight(null);
          setHighlightedCells(new Set());
        }, [selectedLayoutId]);

        // Save to local storage on modification
        const saveStateLocally = (updatedRecipes, updatedLayouts, updatedPin, updatedGithub) => {
          const schema = {
            recipes: updatedRecipes,
            layouts: updatedLayouts,
            pin: updatedPin,
            githubConfig: updatedGithub
          };
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(schema));
        };

        // GitHub Backups integration
        const handleGithubPull = async () => {
          if (!githubConfig.owner || !githubConfig.repo || !githubConfig.token) {
            setSyncStatus({ text: 'エラー: GitHub設定が未完了です。設定を先に入力保存してください。', isError: true });
            return;
          }
          setSyncLoading(true);
          setSyncStatus({ text: 'GitHubから最新データを受信中...', isError: false });

          try {
            const { data, sha } = await loadDataFromGithub(
              githubConfig.owner,
              githubConfig.repo,
              githubConfig.path || 'recipes.json',
              githubConfig.token
            );

            // Re-inflate states
            setRecipes(data.recipes || []);
            setLayouts(data.layouts || []);
            setPin(data.pin || '1234');
            setCurrentSha(sha);

            if (data.layouts && data.layouts.length > 0) {
              setSelectedLayoutId(data.layouts[0].id);
            }

            saveStateLocally(data.recipes, data.layouts, data.pin, githubConfig);
            setSyncStatus({ 
              text: `同期成功! GitHubからデータを読み込みました。\nレシピ数: ${data.recipes?.length || 0}、レイアウト数: ${data.layouts?.length || 0}`, 
              isError: false 
            });
          } catch (err) {
            setSyncStatus({ text: `読み込みエラー: ${err.message}`, isError: true });
          } finally {
            setSyncLoading(false);
          }
        };

        const handleGithubPush = async () => {
          if (!githubConfig.owner || !githubConfig.repo || !githubConfig.token) {
            setSyncStatus({ text: 'エラー: GitHub設定が未完了です。設定を入力保存してください。', isError: true });
            return;
          }
          setSyncLoading(true);
          setSyncStatus({ text: 'GitHubにデータ保存中...', isError: false });

          const currentData = {
            recipes,
            layouts,
            githubConfig,
            pin,
          };

          try {
            const newSha = await saveDataToGithub(
              githubConfig.owner,
              githubConfig.repo,
              githubConfig.path || 'recipes.json',
              githubConfig.token,
              currentData,
              currentSha
            );
            setCurrentSha(newSha);
            setSyncStatus({ text: '同期成功! データをGitHubリポジトリに保存しました（PATは除外されて安全にバックアップに格納されています）。', isError: false });
          } catch (err) {
            setSyncStatus({ text: `保存エラー: ${err.message}\n※競合かトークン無効の可能性があります。再読込してください。`, isError: true });
          } finally {
            setSyncLoading(false);
          }
        };

        // PIN Form Submits
        const handleLogin = (e) => {
          e.preventDefault();
          if (pinInput === pin) {
            setIsManagementMode(true);
            setPinError(null);
            setPinInput('');
          } else {
            setPinError('PINコードが違います。');
          }
        };

        const handleLogout = () => {
          setIsManagementMode(false);
          setEditingRecipe(null);
          setEditingLayout(null);
          setHighlightedCells(new Set());
        };

        const handlePinChangeSubmit = (e) => {
          e.preventDefault();
          if (newPin.trim().length < 4) {
            alert('PINコードは4桁以上にしてください。');
            return;
          }
          setPin(newPin);
          saveStateLocally(recipes, layouts, newPin, githubConfig);
          setNewPin('');
          setPinChangeSuccess(true);
          setTimeout(() => setPinChangeSuccess(false), 2500);
        };

        // Layout helpers
        const activeLayout = useMemo(() => layouts.find(l => l.id === selectedLayoutId) || layouts[0] || null, [layouts, selectedLayoutId]);

        // Pattern matching solver results
        const activeMatches = useMemo(() => {
          return activeLayout ? findMatches(activeLayout.grid, recipes, strictEmptyMatching) : [];
        }, [activeLayout, recipes, strictEmptyMatching]);

        const editingLayoutMatches = useMemo(() => {
          return editingLayout ? findMatches(editingLayout.grid, recipes, strictEmptyMatching) : [];
        }, [editingLayout, recipes, strictEmptyMatching]);

        // Points summaries calculations
        const activeTotalScore = useMemo(() => {
          return activeMatches.reduce((sum, m) => sum + getRecipeScore(m.recipe), 0);
        }, [activeMatches]);

        const editingTotalScore = useMemo(() => {
          return editingLayoutMatches.reduce((sum, m) => sum + getRecipeScore(m.recipe), 0);
        }, [editingLayoutMatches]);

        const activeChessCounts = useMemo(() => {
          return activeLayout ? countChessColors(activeLayout.grid) : null;
        }, [activeLayout]);

        const editingChessCounts = useMemo(() => {
          return editingLayout ? countChessColors(editingLayout.grid) : null;
        }, [editingLayout]);

        // Sorting helpers
        const TARGET_ORDER_PRIORITY = { fighter: 1, rider: 2, shooter: 3, army: 4 };
        const BUFF_TYPE_ORDER_PRIORITY = { atk: 1, def: 2, hp: 3 };

        const sortedActiveMatches = useMemo(() => {
          return [...activeMatches].sort((a, b) => {
            const tA = TARGET_ORDER_PRIORITY[a.recipe.target] || 99;
            const tB = TARGET_ORDER_PRIORITY[b.recipe.target] || 99;
            if (tA !== tB) return tA - tB;
            const tyA = BUFF_TYPE_ORDER_PRIORITY[a.recipe.buffType] || 99;
            const tyB = BUFF_TYPE_ORDER_PRIORITY[b.recipe.buffType] || 99;
            if (tyA !== tyB) return tyA - tyB;
            return b.recipe.value - a.recipe.value;
          });
        }, [activeMatches]);

        const sortedEditingMatches = useMemo(() => {
          return [...editingLayoutMatches].sort((a, b) => {
            const tA = TARGET_ORDER_PRIORITY[a.recipe.target] || 99;
            const tB = TARGET_ORDER_PRIORITY[b.recipe.target] || 99;
            if (tA !== tB) return tA - tB;
            const tyA = BUFF_TYPE_ORDER_PRIORITY[a.recipe.buffType] || 99;
            const tyB = BUFF_TYPE_ORDER_PRIORITY[b.recipe.buffType] || 99;
            if (tyA !== tyB) return tyA - tyB;
            return b.recipe.value - a.recipe.value;
          });
        }, [editingLayoutMatches]);

        // Helper to get coordinates for standard 4x4 recipe on 5x7 board
        const getMatchCoords = (match) => {
          const coords = new Set();
          if (!match) return coords;
          for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
              if (match.recipe.grid[i][j] !== 'empty') {
                const tr = match.row + i;
                const tc = match.col + j;
                if (tr >= 0 && tr < 5 && tc >= 0 && tc < 7) {
                  coords.add(`${tr},${tc}`);
                }
              }
            }
          }
          return coords;
        };

        // Coordinate triggers on cell highlight hovers
        const handleMouseEnterMatch = (match) => {
          setHighlightedCells(getMatchCoords(match));
        };

        const handleMouseLeaveMatch = () => {
          if (selectedMatchForHighlight) {
            setHighlightedCells(getMatchCoords(selectedMatchForHighlight));
          } else {
            setHighlightedCells(new Set());
          }
        };

        // Click handler to toggle persistent highlight
        const handleMatchClick = (match) => {
          const key = `${match.recipe.id}-${match.row}-${match.col}`;
          const selectedKey = selectedMatchForHighlight 
            ? `${selectedMatchForHighlight.recipe.id}-${selectedMatchForHighlight.row}-${selectedMatchForHighlight.col}` 
            : '';
          
          if (selectedKey === key) {
            setSelectedMatchForHighlight(null);
            setHighlightedCells(new Set());
          } else {
            setSelectedMatchForHighlight(match);
            setHighlightedCells(getMatchCoords(match));
          }
        };

        // Layout design interactions
        const handleLayoutCellClick = (r, c) => {
          if (!isManagementMode) return;
          if (editingLayout) {
            const nextGrid = editingLayout.grid.map(row => [...row]);
            const prevColor = nextGrid[r][c];
            // Cycle toggle or paint active selected color palette
            nextGrid[r][c] = (prevColor === activePaletteColor) ? 'empty' : activePaletteColor;
            setEditingLayout({ ...editingLayout, grid: nextGrid });
          } else {
            // Modify active layout instantly if no edit subgrid open
            const layoutToMod = layouts.find(l => l.id === selectedLayoutId);
            if (!layoutToMod) return;
            const nextGrid = layoutToMod.grid.map(row => [...row]);
            const prevColor = nextGrid[r][c];
            nextGrid[r][c] = (prevColor === activePaletteColor) ? 'empty' : activePaletteColor;
            
            const updated = layouts.map(l => l.id === selectedLayoutId ? { ...l, grid: nextGrid } : l);
            setLayouts(updated);
            saveStateLocally(recipes, updated, pin, githubConfig);
          }
        };

        const handleRecipeCellClick = (r, c) => {
          if (!editingRecipe) return;
          const nextGrid = editingRecipe.grid.map(row => [...row]);
          const prevColor = nextGrid[r][c];
          nextGrid[r][c] = (prevColor === activePaletteColor) ? 'empty' : activePaletteColor;
          setEditingRecipe({ ...editingRecipe, grid: nextGrid });

            id: `recipe_${Date.now()}`,

            grid: createEmptyGrid(4, 4),

            buffType: 'hp',
            value: 10,
            createdAt: Date.now()

          e.preventDefault();
          if (!editingRecipe.name.trim()) {
            alert('レシピ名を入力してください。');
            return;

          const exist = recipes.some(r => r.id === editingRecipe.id);

            nextRecipes = [editingRecipe, ...recipes];

          setRecipes(nextRecipes);
          saveStateLocally(nextRecipes, layouts, pin, githubConfig);
          setEditingRecipe(null);

          setRecipes(updated);

            return;

          saveStateLocally(recipes, updated, pin, githubConfig);

                          <span className="text-[10px] font-bold text-zinc-400 block tracking-wider uppercase mb-2">

                          <div className="grid grid-cols-5 gap-1.5 text-center">

                              return (

                            <button
                              type="submit"
                              className="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xs py-2.5 rounded-lg shadow-xs transition-colors cursor-pointer"
                            >
                              レシピを保存
                            </button>
                            <button
                              type="button"
                              onClick={() => setEditingRecipe(null)}
                              className="bg-zinc-100 hover:bg-zinc-200 text-zinc-600 text-xs font-bold px-4 py-2.5 rounded-lg cursor-pointer"
                            >
                              リセット
                            </button>
                          </div>
                        </div>
                      </form>
                    </div>
                  )}

                  {/* REGISTERED PATTERN RECIPES MASTER LIST */}
                  <div className="bg-white rounded-2xl p-5 border border-zinc-200/85 shadow-sm">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-zinc-150">
                      <div>
                        <h3 className="text-xs font-bold text-zinc-400 uppercase tracking-widest block">
                          レシピ一覧・登録マスター
                        </h3>
                        <span className="text-[10px] text-zinc-450 mt-0.5 block font-medium">合計 {recipes.length}種類 登録中</span>
                      </div>

                      {isManagementMode && !editingRecipe && (
                        <button
                          onClick={startCreateRecipe}
                          type="button"
                          className="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition-all cursor-pointer shadow-xs font-sans"
                        >
                          ＋ レシピを追加
                        </button>
                      )}
                    </div>

                    {recipes.length === 0 ? (
                      <p className="text-xs text-zinc-400 text-center py-8">登録済みのレシピはありません。</p>
                    ) : (
                      <div className="space-y-2.5 max-h-[450px] overflow-y-auto pr-1">
                        {recipes.map(re => {
                          const score = getRecipeScore(re);
                          const chessCount = getRecipeChessCount(re.grid);
                          return (
                            <div 
                              key={re.id}
                              className={`p-3 rounded-xl border flex flex-col gap-2 transition-all
                                ${editingRecipe?.id === re.id 
                                  ? 'bg-indigo-50/50 border-indigo-300' 
                                  : 'bg-zinc-50 hover:bg-zinc-100/50 border-zinc-200/80'
                                }
                              `}
                            >
                              <div className="flex justify-between items-start gap-2">
                                <div className="truncate">
                                  <span className="text-xs font-bold text-zinc-800 block truncate">{re.name}</span>
                                  <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                                    <span className="text-[9px] px-1.5 py-0.5 bg-zinc-250 text-zinc-700 font-bold rounded">
                                      {TARGET_LABELS[re.target]}
                                    </span>
                                    <span className="text-[9px] px-1.5 py-0.5 bg-amber-50 text-amber-700 font-bold border border-amber-200 rounded font-mono shadow-3xs">
                                      {score.toLocaleString()} pt
                                    </span>
                                    <span className="text-[9px] text-zinc-450 font-medium">
                                      チェス:{chessCount}個
                                    </span>
                                    <span className="text-[10px] font-bold text-indigo-600 uppercase tracking-wide">
                                      {BUFF_TYPE_LABELS[re.buffType]} +{re.value}%
                                    </span>
                                  </div>
                                </div>

                                <div className="flex gap-1 shrink-0">
                                  <button
                                    onClick={() => {
                                      // Render hover grid matching coordinates manually
                                      const dummyMatch = { recipe: re, row: 0, col: 0 };
                                      handleMouseEnterMatch(dummyMatch);
                                    }}
                                    onMouseLeave={handleMouseLeaveMatch}
                                    className="p-1 px-1.5 text-zinc-400 hover:text-indigo-600 hover:bg-white rounded border border-transparent hover:border-zinc-200 flex items-center gap-0.5 transition-all text-[10px]"
                                    title="パターンを簡易確認します"
                                  >
                                    形状表示
                                  </button>

                                  {isManagementMode && (
                                    <>
                                      <button
                                        onClick={() => setEditingRecipe({ ...re })}
                                        className="p-1 text-zinc-400 hover:text-indigo-600 hover:bg-white rounded border border-transparent hover:border-zinc-200 transition-colors"
                                        title="レシピを編集"
                                      >
                                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                          <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                        </svg>
                                      </button>
                                      <button
                                        onClick={() => handleDeleteRecipe(re.id)}
                                        className="p-1 text-zinc-400 hover:text-rose-600 hover:bg-white rounded border border-transparent hover:border-zinc-250 transition-colors"
                                        title="レシピを削除"
                                      >
                                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                      </button>
                                    </>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* Quick export / backup JSON */}
                    <div className="mt-4 pt-3 border-t border-zinc-150 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <span className="text-[10px] text-zinc-400 block max-w-xs leading-normal">
                        ローカルデータの簡易エクスポートが可能です。コピーしてバックアップとしてお使いください。
                      </span>
                      <button
                        onClick={() => {
                          const schema = { recipes, layouts, pin };
                          const blob = new Blob([JSON.stringify(schema, null, 2)], { type: 'application/json' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = `chess_backup_${Date.now()}.json`;
                          a.click();
                        }}
                        className="text-[10px] bg-zinc-100 hover:bg-zinc-200 text-zinc-700 py-1.5 px-3 rounded-lg font-bold border border-zinc-200 shrink-0 self-end transition-all"
                      >
                        JSONとしてエクスポート
                      </button>
                    </div>
                  </div>

                  {/* ADVANCED CLOUD GITHUB SYNCHRONIZER */}
                  {isManagementMode && (
                    <GitHubConfigPanel
                      config={githubConfig}
                      onSaveConfig={handleGithubConfigSave}
                      onPull={handleGithubPull}
                      onPush={handleGithubPush}
                      statusMsg={syncStatus}
                      loading={syncLoading}
                    />
                  )}

                  {/* SECURITY / PASSWORD CONFIGURE IF IN EDIT MODE */}
                  {isManagementMode && (
                    <div className="bg-white p-5 rounded-2xl border border-zinc-200/85">
                      <h4 className="text-xs font-bold text-zinc-400 uppercase tracking-widest mb-3">
                        セキュリティPINコード変更
                      </h4>
                      <form onSubmit={handlePinChangeSubmit} className="flex gap-2">
                        <input
                          type="text"
                          placeholder="新しいPINを設定 (e.g. 5678)"
                          value={newPin}
                          onChange={(e) => setNewPin(e.target.value)}
                          className="bg-zinc-50 border border-zinc-200 text-xs px-3.5 py-2.5 rounded-xl font-mono text-zinc-800 placeholder-zinc-400 focus:outline-none focus:border-indigo-500 font-semibold focus:ring-1 focus:ring-indigo-500"
                        />
                        <button
                          type="submit"
                          className="bg-zinc-800 hover:bg-zinc-900 text-xs text-white font-bold px-4 py-2.5 rounded-xl transition-all shadow-xs cursor-pointer"
                        >
                          変更する
                        </button>
                      </form>
                      {pinChangeSuccess && (
                        <p className="text-[10px] text-emerald-600 font-bold block mt-1.5 font-sans">
                          ✓ PINを変更しました。新しいPIN: {pin}
                        </p>
                      )}
                    </div>
                  )}

                </div>

              </div>
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
