<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Puzzles & Survival Chess Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-6">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black">CHESS LAYOUT MANAGER</h1>
            <div class="space-x-2">
                <button onclick="document.getElementById('admin-modal').classList.remove('hidden')" class="text-xs bg-slate-800 px-4 py-2 rounded">管理設定</button>
            </div>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <section class="bg-slate-900 p-4 rounded-xl">
                <h2 class="text-sm font-bold mb-4">フルレイアウト (5x7)</h2>
                <div id="full-board" class="grid grid-cols-7 gap-1 w-fit bg-slate-950 p-2 rounded"></div>
                <div id="stats" class="mt-4 text-xs space-y-1"></div>
            </section>
            <section class="bg-slate-900 p-4 rounded-xl">
                <h2 class="text-sm font-bold mb-4">レシピ一覧</h2>
                <div id="recipe-list" class="space-y-2 h-[400px] overflow-y-auto pr-2"></div>
            </section>
        </div>
    </div>

    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-slate-900 p-6 rounded-lg w-full max-w-sm">
            <h2 class="font-bold mb-4">GitHub同期設定</h2>
            <input type="text" id="cfg-owner" placeholder="Owner" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
            <input type="text" id="cfg-repo" placeholder="Repo" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
            <input type="password" id="cfg-token" placeholder="GitHub PAT" class="w-full bg-slate-800 p-2 mb-2 rounded text-sm">
            <input type="password" id="cfg-pin" placeholder="PIN(4桁)" class="w-full bg-slate-800 p-2 mb-4 rounded text-sm">
            <button onclick="saveAdmin()" class="w-full bg-indigo-600 py-2 rounded font-bold mb-2">保存</button>
            <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="w-full text-slate-500 text-sm">閉じる</button>
        </div>
    </div>

<script>
    let recipes = [], layout = [], sha = '';
    const cfg = JSON.parse(localStorage.getItem('pz_cfg') || '{}');

    async function loadData() {
        if (!cfg.token) return;
        const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/recipes.json`;
        const res = await fetch(url, { headers: { 'Authorization': `token ${cfg.token}` } });
        const data = await res.json();
        sha = data.sha;
        recipes = JSON.parse(atob(data.content));
        renderRecipes();
    }

    async function pushToGitHub() {
        const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/recipes.json`;
        const body = {
            message: "更新: " + new Date().toLocaleString(),
            content: btoa(unescape(encodeURIComponent(JSON.stringify(recipes)))),
            sha: sha
        };
        const res = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${cfg.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if(res.ok) alert("保存成功！");
    }

    function renderRecipes() {
        const list = document.getElementById('recipe-list');
        list.innerHTML = recipes.map(r => `
            <div class="flex justify-between bg-slate-800 p-3 rounded text-xs items-center">
                <div class="truncate mr-2">${r.name}</div>
                <button onclick="addToLayout('${r.id}')" class="bg-indigo-600 px-3 py-1 rounded shrink-0">追加</button>
            </div>
        `).join('');
    }

    function addToLayout(id) {
        if(layout.find(r => r.id === id)) return alert("重複使用はできません");
        const recipe = recipes.find(r => r.id === id);
        layout.push(recipe);
        updateStats();
    }

    function updateStats() {
        let cost = {red:0, blue:0, green:0, yellow:0, purple:0};
        layout.forEach(r => {
            Object.keys(r.cost).forEach(c => cost[c] += r.cost[c]);
        });
        document.getElementById('stats').innerHTML = `
            <div class="p-3 bg-slate-950 rounded">
                <p class="text-green-400 font-bold">必要コスト: ${JSON.stringify(cost)}</p>
            </div>
        `;
    }

    function saveAdmin() {
        const newCfg = {
            owner: document.getElementById('cfg-owner').value,
            repo: document.getElementById('cfg-repo').value,
            token: document.getElementById('cfg-token').value,
            pin: document.getElementById('cfg-pin').value
        };
        localStorage.setItem('pz_cfg', JSON.stringify(newCfg));
        location.reload();
    }

    loadData();
</script>
</body>
</html>
