<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チェス盤面 自動提案ツール</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--line:#e4e4e7;--ink:#27272a;--sub:#71717a;--ac:#4f46e5;
--red:#f43f5e;--blue:#0ea5e9;--green:#10b981;--yellow:#fbbf24;--purple:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--card:#27272a;--line:#3f3f46;--ink:#f4f4f5;--sub:#a1a1aa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
header{background:#18181b;color:#fff;padding:16px 20px}header h1{margin:0;font-size:17px}header p{margin:2px 0 0;font-size:11px;color:#a1a1aa}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:12px;letter-spacing:.08em;color:var(--sub);margin:0 0 10px;text-transform:uppercase}
.grp{margin-bottom:10px}.grp b{font-size:12px;display:block;margin-bottom:4px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:5px 9px;margin:0 6px 6px 0;cursor:pointer;user-select:none}
.chk.on{background:#eef2ff;border-color:var(--ac);color:#3730a3}
@media(prefers-color-scheme:dark){.chk.on{background:#312e81;color:#e0e7ff}}
.chk input{display:none}
button{font:inherit;cursor:pointer}
.go{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:14px}
.go:disabled{opacity:.5;cursor:default}
.sm{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:11px}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:460px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid rgba(0,0,0,.12);color:#fff}
.cell.empty{background:transparent;border:2px dashed var(--line);color:var(--sub);font-weight:400;font-size:10px}
.cell.hl{outline:4px solid rgba(79,70,229,.45);transform:scale(1.06)}
.c1{background:var(--red)}.c2{background:var(--blue)}.c3{background:var(--green)}.c4{background:var(--yellow);color:#451a03}.c5{background:var(--purple)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:12px}
.item{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:4px}
.item.ok{background:#ecfdf5;border-color:#a7f3d0}.item.ng{opacity:.55}.item.req-ng{background:#fff1f2;border-color:#fda4af;opacity:1}
@media(prefers-color-scheme:dark){.item.ok{background:#064e3b}.item.req-ng{background:#4c0519}}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;font-size:12px}
.badge{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:99px;padding:2px 10px;font-weight:700}
.warn{margin-top:10px;font-size:12px;color:#be123c;background:#fff1f2;border:1px solid #fda4af;border-radius:10px;padding:8px 10px}
.hint{font-size:11px;color:var(--sub)}
textarea{width:100%;height:110px;font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--ac)}
</style>
</head>
<body>
<header><h1>チェス盤面 自動提案ツール</h1><p>必須にしたいバフを選んで開始すると、7×5の盤面を探索して提案します</p></header>
<main>
<section class="card">
  <h2>① 必須のバフを選ぶ</h2>
  <div id="groups"></div>
  <h2 style="margin-top:14px">② 重視する兵種（ボーナス×3で優先）</h2>
  <div id="focus"></div>
  <label class="chk on" style="margin-top:4px" id="clrLbl"><input type="checkbox" id="clr" checked>使わないマスは空きにする</label>
  <button class="go" id="go" style="margin-top:10px">開始（盤面を探索）</button>
  <div class="bar"><i id="bar"></i></div>
  <p class="hint" id="src" style="margin-top:10px"></p>
  <input type="file" id="file" accept=".json" style="font-size:11px">
</section>
<section class="card">
  <h2>③ 提案された盤面</h2>
  <div id="board" class="board"></div>
  <div class="sum" id="sum"></div>
  <div id="warn"></div>
  <div class="res" id="res"></div>
  <p class="hint">項目をタップすると盤面上の該当位置が光ります。</p>
  <button class="sm" id="copy" style="display:none;margin-top:6px">盤面JSONをコピー（recipes.json の layouts に貼り付け用）</button>
  <textarea id="json" style="display:none;margin-top:8px" readonly></textarea>
</section>
</main>
<script>
// ===== solver core (no DOM) =====
const COLORS = ['empty','red','blue','green','yellow','purple'];
const ROWS = 5, COLS = 7;

function prepareRecipes(recipes) {
  return recipes.map(r => {
    const cells = [];
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const c = r.grid[i][j];
      if (c && c !== 'empty') cells.push([i, j, COLORS.indexOf(c)]);
    }
    if (!cells.length) return { id: r.id, offs: [], positions: [] };
    const minR = Math.min(...cells.map(c => c[0])), minC = Math.min(...cells.map(c => c[1]));
    const offs = cells.map(c => [c[0] - minR, c[1] - minC, c[2]]);
    const h = Math.max(...offs.map(o => o[0])) + 1, w = Math.max(...offs.map(o => o[1])) + 1;
    const positions = [];
    for (let r0 = 0; r0 + h <= ROWS; r0++) for (let c0 = 0; c0 + w <= COLS; c0++) {
      positions.push(offs.map(o => (r0 + o[0]) * COLS + c0 + o[1]));
    }
    return { id: r.id, offs, positions, colors: offs.map(o => o[2]) };
  });
}

// returns array of matched position index (or -1) per recipe
function matchAll(board, prep) {
  const res = new Array(prep.length).fill(-1);
  for (let k = 0; k < prep.length; k++) {
    const p = prep[k];
    if (!p.positions || !p.positions.length) continue;
    const col = p.colors;
    outer: for (let q = 0; q < p.positions.length; q++) {
      const pos = p.positions[q];
      for (let t = 0; t < pos.length; t++) if (board[pos[t]] !== col[t]) continue outer;
      res[k] = q; break;
    }
  }
  return res;
}

function score(board, prep, weights) {
  const m = matchAll(board, prep);
  let s = 0;
  for (let k = 0; k < m.length; k++) if (m[k] >= 0) s += weights[k];
  return s;
}

function randomBoard(rng) {
  const b = new Int8Array(ROWS * COLS);
  for (let i = 0; i < b.length; i++) b[i] = 1 + Math.floor(rng() * 5);
  return b;
}

function runSA(prep, weights, iters, rng, T0 = 8, T1 = 1.5) {
  let cur = randomBoard(rng), curS = score(cur, prep, weights);
  let best = cur.slice(), bestS = curS;
  for (let it = 0; it < iters; it++) {
    const T = T0 * Math.pow(T1 / T0, it / iters);
    const i = Math.floor(rng() * cur.length);
    const old = cur[i];
    let nc = 1 + Math.floor(rng() * 5);
    if (nc === old) nc = 1 + (nc % 5);
    cur[i] = nc;
    const ns = score(cur, prep, weights);
    if (ns >= curS || rng() < Math.exp((ns - curS) / T)) {
      curS = ns;
      if (curS > bestS) { bestS = curS; best = cur.slice(); }
    } else cur[i] = old;
  }
  return { board: best, score: bestS };
}

// clear cells not used by any matched recipe (matches stay valid)
function clearUnused(board, prep) {
  const m = matchAll(board, prep), used = new Set();
  m.forEach((q, k) => { if (q >= 0) prep[k].positions[q].forEach(p => used.add(p)); });
  const out = board.slice();
  for (let i = 0; i < out.length; i++) if (!used.has(i)) out[i] = 0;
  return out;
}

</script>
<script>
const TL={fighter:'ファイター',rider:'ライダー',shooter:'シューター',army:'部隊'};
const BL={atk:'ATK',def:'DEF',hp:'HP'};
const CN=['','赤','青','緑','黄','紫'];
let recipes=[],prep=[],last=null,hl=new Set();

function builtin(){
  const L=[],g=(cs,v)=>{const a=Array.from({length:4},()=>Array(4).fill('empty'));cs.forEach((c,i)=>{if(v)a[i][0]=c;else a[0][i]=c});return a};
  const n=[['army','hp',5,['blue','green','red']],['army','def',5,['red','green','blue']],['rider','def',10,['blue','yellow','purple'],1],['fighter','def',10,['green','yellow','purple'],1],['shooter','def',10,['red','yellow','purple'],1]];
  n.forEach(x=>L.push({id:'v'+L.length,name:'',grid:g(x[3],true),target:x[0],buffType:x[1],value:x[2]}));
  const h=[['army','hp',5,['blue','green','red']],['army','def',5,['red','green','blue']],['rider','hp',10,['blue','yellow','purple']],['fighter','hp',10,['green','yellow','purple']],['shooter','hp',10,['red','yellow','purple']]];
  h.forEach(x=>L.push({id:'h'+L.length,name:'',grid:g(x[3],false),target:x[0],buffType:x[1],value:x[2]}));
  [['yellow','army','hp'],['purple','army','def'],['blue','rider','atk'],['green','fighter','atk'],['red','shooter','atk']].forEach(x=>{
    [true,false].forEach(v=>L.push({id:'r'+L.length,name:'',grid:g([x[0],x[0],x[0],x[0]],v),target:x[1],buffType:x[2],value:20}))});
  return L;
}
function shapeLabel(r){let rs=new Set(),n=0;r.grid.forEach((row,i)=>row.forEach(c=>{if(c!=='empty'){rs.add(i);n++}}));return n<2?'':(rs.size===1?'横':'縦')}
function label(r){return `${TL[r.target]} ${BL[r.buffType]} +${r.value}%${shapeLabel(r)?'（'+shapeLabel(r)+'）':''}`}

function setRecipes(list,srcText){
  recipes=list;prep=prepareRecipes(recipes);document.getElementById('src').textContent=srcText+`（レシピ ${recipes.length}件）`;
  const gs=document.getElementById('groups');gs.innerHTML='';
  ['fighter','rider','shooter','army'].forEach(t=>{
    const rs=recipes.filter(r=>r.target===t).sort((a,b)=>({atk:1,def:2,hp:3}[a.buffType]-{atk:1,def:2,hp:3}[b.buffType])||b.value-a.value);
    if(!rs.length)return;const d=document.createElement('div');d.className='grp';d.innerHTML=`<b>${TL[t]}</b>`;
    rs.forEach(r=>{const l=document.createElement('label');l.className='chk';l.innerHTML=`<input type="checkbox" data-id="${r.id}">${label(r)}`;
      l.querySelector('input').onchange=e=>l.classList.toggle('on',e.target.checked);d.appendChild(l)});gs.appendChild(d)});
  const f=document.getElementById('focus');f.innerHTML='';
  ['fighter','rider','shooter','army'].forEach(t=>{const l=document.createElement('label');l.className='chk';l.innerHTML=`<input type="checkbox" data-t="${t}">${TL[t]}`;
    l.querySelector('input').onchange=e=>l.classList.toggle('on',e.target.checked);f.appendChild(l)});
  last=null;render();
}

function render(){
  const b=document.getElementById('board');b.innerHTML='';
  const board=last?last.board:null;
  for(let i=0;i<35;i++){const v=board?board[i]:0;const c=document.createElement('div');
    c.className='cell '+(v?'c'+v:'empty')+(hl.has(i)?' hl':'');c.textContent=v?CN[v]:(board?'':'');b.appendChild(c)}
  const res=document.getElementById('res'),sum=document.getElementById('sum'),warn=document.getElementById('warn');
  res.innerHTML='';sum.innerHTML='';warn.innerHTML='';
  document.getElementById('copy').style.display=board?'':'none';document.getElementById('json').style.display='none';
  if(!board)return;
  const m=matchAll(board,prep),req=new Set([...document.querySelectorAll('#groups input:checked')].map(i=>i.dataset.id));
  let tot=0,cnt=0,miss=[];
  const order=recipes.map((r,k)=>k).sort((a,b)=>(m[b]>=0)-(m[a]>=0)||({fighter:1,rider:2,shooter:3,army:4}[recipes[a].target]-{fighter:1,rider:2,shooter:3,army:4}[recipes[b].target]));
  order.forEach(k=>{const r=recipes[k],ok=m[k]>=0;if(ok){tot+=r.value;cnt++}else if(req.has(r.id))miss.push(label(r));
    const d=document.createElement('div');d.className='item '+(ok?'ok':(req.has(r.id)?'req-ng':'ng'));
    d.innerHTML=`<span>${ok?'✓':'×'} ${label(r)}</span>`;
    if(ok)d.onclick=()=>{hl=new Set(prep[k].positions[m[k]]);render()};res.appendChild(d)});
  sum.innerHTML=`<span class="badge">揃った図案 ${cnt}/${recipes.length}</span><span class="badge">ボーナス合計 ${tot}%分</span>`;
  if(miss.length)warn.innerHTML=`<div class="warn">必須のうち揃わなかったもの：${miss.join('、')}<br>この組み合わせは同時に成立しない可能性が高いです（探索で見つからなかっただけの場合もあります）。必須を減らして再実行してください。</div>`;
}

document.getElementById('go').onclick=async()=>{
  const go=document.getElementById('go'),bar=document.getElementById('bar');go.disabled=true;hl=new Set();
  const req=new Set([...document.querySelectorAll('#groups input:checked')].map(i=>i.dataset.id));
  const foc=new Set([...document.querySelectorAll('#focus input:checked')].map(i=>i.dataset.t));
  const w=recipes.map(r=>(req.has(r.id)?2000:0)+r.value*(foc.has(r.target)?3:1));
  let best=null;const N=24;
  for(let i=0;i<N;i++){
    const r=runSA(prep,w,100000,Math.random);if(!best||r.score>best.score)best=r;
    bar.style.width=((i+1)/N*100)+'%';await new Promise(r=>setTimeout(r,0));
  }
  let bd=best.board;if(document.getElementById('clr').checked)bd=clearUnused(bd,prep);
  last={board:bd};render();go.disabled=false;
};
document.getElementById('clrLbl').onchange=e=>e.currentTarget.classList.toggle('on',e.target.checked);
document.getElementById('copy').onclick=()=>{
  const g=[];for(let r=0;r<5;r++){g.push([]);for(let c=0;c<7;c++)g[r].push(['empty','red','blue','green','yellow','purple'][last.board[r*7+c]])}
  const o={id:'layout_'+Date.now(),name:'自動提案',grid:g,createdAt:Date.now()};
  const t=document.getElementById('json');t.value=JSON.stringify(o,null,2);t.style.display='';t.select();
  try{navigator.clipboard.writeText(t.value)}catch(e){}
};
document.getElementById('file').onchange=async e=>{
  try{const j=JSON.parse(await e.target.files[0].text());setRecipes(j.recipes||j,'読み込んだファイル')}catch(err){alert('JSONを読み込めませんでした')}
};
(async()=>{
  try{const r=await fetch('./recipes.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j.recipes&&j.recipes.length){setRecipes(j.recipes,'recipes.json から読み込み');return}}}catch(e){}
  setRecipes(builtin(),'内蔵の標準レシピ（20種）');
})();
</script>
</body>
</html>
